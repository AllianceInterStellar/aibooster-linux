name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build \
            qt6-base-dev qt6-declarative-dev libgl1-mesa-dev \
            libssl-dev

      - name: Configure
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel

      - name: Install into a staging prefix
        run: |
          DESTDIR="$PWD/stage" cmake --install build --prefix /usr
          find stage -type f | sort

      # Compiling proves the C++ is well formed; it proves nothing about the QML, which is
      # loaded at runtime. Start the app on the offscreen platform and fail on any QML
      # error — that is what catches a renamed property or a missing import.
      - name: Smoke test (offscreen)
        run: |
          # Exactly the modules the QML imports (QtQuick, QtQuick.Controls,
          # QtQuick.Layouts) plus what Controls needs at runtime. Deliberately no
          # QtQuick.Effects: nothing imports it, and it does not exist before Qt 6.5 —
          # asking for it made this step fail on the Qt 6.4 we target.
          sudo apt-get install -y --no-install-recommends \
            qml6-module-qtquick qml6-module-qtquick-window \
            qml6-module-qtquick-controls qml6-module-qtquick-layouts \
            qml6-module-qtquick-templates qml6-module-qtqml-workerscript \
            libqt6svg6
          # The pass condition is the EXIT CODE, not a log pattern. main() wires
          # objectCreationFailed to exit(-1), so a QML failure makes the process die at
          # once; a healthy app runs until timeout kills it, which is exit 124. Grepping
          # for phrases was tried first and reported success while the log plainly said
          # "failed to load component" — the pattern simply did not match that wording.
          set +e
          QT_QPA_PLATFORM=offscreen timeout 20s ./build/aibooster > smoke.log 2>&1
          rc=$?
          set -e
          cat smoke.log

          if [ "$rc" -ne 124 ]; then
            echo "::error::App exited on its own (code $rc) instead of running until the \
          timeout — start-up failed. See the log above."
            exit 1
          fi

          # Secondary net for problems that do not abort start-up.
          if grep -qiE 'failed to load component|is not installed|is not a type|Cannot assign|ReferenceError|\.qml:[0-9]+.*error' smoke.log; then
            echo "::error::QML problems during start-up"
            exit 1
          fi
          echo "App stayed up for the full timeout with a clean QML log."

      # Engine supervision against a stub engine, and the desktop-proxy round trip.
      # dbus-run-session gives gsettings a session bus; without one the GNOME backend is
      # unusable and the proxy test would skip itself into a meaningless pass.
      - name: Test
        run: |
          sudo apt-get install -y --no-install-recommends \
            dbus-x11 dconf-cli gsettings-desktop-schemas python3
          export XDG_STATE_HOME="$RUNNER_TEMP/state"
          mkdir -p "$XDG_STATE_HOME"

          # Run the binaries rather than ctest, and assert on QTest's own Totals line.
          # A QSKIP exits zero, so ctest reports "Passed" for a test that decided not to
          # run — and the proxy test skips itself when it finds no gsettings backend,
          # which is exactly the condition a CI runner can drift into. Requiring
          # "0 skipped" makes that a failure instead of a green tick over nothing.
          for t in test_coreprocess test_systemproxy; do
            echo "── $t ─────────────────────────────────"
            QT_QPA_PLATFORM=offscreen dbus-run-session -- "./build/$t" 2>&1 | tee "$t.out"
            totals="$(grep -E '^Totals:' "$t.out" | tail -1)"
            echo "$totals"
            if [ -z "$totals" ]; then
              echo "::error::$t produced no Totals line — it did not run to completion"; exit 1
            fi
            case "$totals" in
              *"0 failed"*) ;;
              *) echo "::error::$t had failures"; exit 1 ;;
            esac
            case "$totals" in
              *"0 skipped"*) ;;
              *) echo "::error::$t skipped tests; a skipped suite is not a passing suite"; exit 1 ;;
            esac
          done
          echo "All tests ran and passed with nothing skipped."

      # Starting is not the same as rendering. Run under a real X server and photograph the
      # window: a client whose UI comes up blank passes every check above.
      - name: Screenshot the UI
        run: |
          sudo apt-get install -y --no-install-recommends \
            xvfb x11-apps x11-utils imagemagick
          Xvfb :99 -screen 0 1280x900x24 &
          sleep 3
          export DISPLAY=:99
          ./build/aibooster > ui.log 2>&1 &
          APP_PID=$!
          sleep 12
          if ! kill -0 "$APP_PID" 2>/dev/null; then
            echo "::error::The app exited before it could be photographed"
            cat ui.log; exit 1
          fi
          xwd -root -silent | convert xwd:- ui.png
          kill "$APP_PID" || true
          identify ui.png
          cat ui.log || true

      - name: Upload screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-screenshot
          path: |
            ui.png
            ui.log
          if-no-files-found: warn

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: aibooster-linux-x86_64
          path: build/aibooster
          if-no-files-found: error

  package:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build \
            qt6-base-dev qt6-declarative-dev libgl1-mesa-dev libssl-dev \
            dpkg-dev

      - name: Build and stage
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel
          DESTDIR="$PWD/pkgroot" cmake --install build --prefix /usr

      - name: Assemble .deb
        run: bash packaging/build-deb.sh "$PWD/pkgroot"

      - uses: actions/upload-artifact@v4
        with:
          name: aibooster-deb
          path: dist/*.deb
          if-no-files-found: error
