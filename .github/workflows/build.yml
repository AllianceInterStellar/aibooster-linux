name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build \
            qt6-base-dev qt6-declarative-dev libgl1-mesa-dev \
            libssl-dev

      - name: Configure
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel

      - name: Install into a staging prefix
        run: |
          DESTDIR="$PWD/stage" cmake --install build --prefix /usr
          find stage -type f | sort

      # Compiling proves the C++ is well formed; it proves nothing about the QML, which is
      # loaded at runtime. Start the app on the offscreen platform and fail on any QML
      # error — that is what catches a renamed property or a missing import.
      - name: Smoke test (offscreen)
        run: |
          # Exactly the modules the QML imports (QtQuick, QtQuick.Controls,
          # QtQuick.Layouts) plus what Controls needs at runtime. Deliberately no
          # QtQuick.Effects: nothing imports it, and it does not exist before Qt 6.5 —
          # asking for it made this step fail on the Qt 6.4 we target.
          sudo apt-get install -y --no-install-recommends \
            qml6-module-qtquick qml6-module-qtquick-window \
            qml6-module-qtquick-controls qml6-module-qtquick-layouts \
            qml6-module-qtquick-templates
          set -o pipefail
          QT_QPA_PLATFORM=offscreen QT_LOGGING_RULES='qt.qml.binding.removal.info=false' \
            timeout 20s ./build/aibooster 2>&1 | tee smoke.log || true
          if grep -qiE '\.qml:[0-9]+.*(error|is not a type|Cannot assign|ReferenceError)' smoke.log; then
            echo "::error::QML errors during start-up"
            exit 1
          fi
          echo "No QML errors."

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: aibooster-linux-x86_64
          path: build/aibooster
          if-no-files-found: error

  package:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build \
            qt6-base-dev qt6-declarative-dev libgl1-mesa-dev libssl-dev \
            dpkg-dev

      - name: Build and stage
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel
          DESTDIR="$PWD/pkgroot" cmake --install build --prefix /usr

      - name: Assemble .deb
        run: bash packaging/build-deb.sh "$PWD/pkgroot"

      - uses: actions/upload-artifact@v4
        with:
          name: aibooster-deb
          path: dist/*.deb
          if-no-files-found: error
