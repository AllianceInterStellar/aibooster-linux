name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish (created if absent)"
        required: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Built on the oldest release we support, so the packages install on 22.04 and
          # everything newer. Native runners for both architectures — cross-compiling Qt
          # is far more trouble than asking for the right machine.
          - { runner: ubuntu-22.04,     arch: amd64, goarch: amd64 }
          - { runner: ubuntu-22.04-arm, arch: arm64, goarch: arm64 }

    runs-on: ${{ matrix.runner }}
    name: ${{ matrix.arch }}

    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build dpkg-dev \
            qt6-base-dev qt6-declarative-dev libqt6opengl6-dev \
            libgl1-mesa-dev libqt6svg6 libssl-dev

      - name: Build the client
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DAIBOOSTER_BUILD_TESTS=OFF
          cmake --build build --parallel
          file build/aibooster

      # The engine is a separate GPL-3.0 program. Its source is not in this repository, but
      # it is published — as the corresponding source for the binaries we hand out, which
      # GPL-3.0 requires of us. Building it here is what makes the packages work on install.
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.1"
          cache: false

      - name: Build the engine
        env:
          # Pinned: Go will otherwise honour a toolchain directive and silently fetch a
          # newer compiler, and a vendored TLS package asserts at init that its struct
          # layout matches crypto/tls — an assertion that is specific to one Go version.
          GOTOOLCHAIN: go1.26.1
        run: |
          git clone --depth 1 https://github.com/AllianceInterStellar/aibooster-engine.git engine-src
          cd engine-src
          go version

          # Fetch dependencies separately and retry. The module proxy drops connections
          # often enough that a one-shot build fails on the download rather than on
          # anything about the code — which is a confusing way to lose a release.
          for attempt in 1 2 3; do
            if go mod download; then break; fi
            echo "module download attempt $attempt failed; retrying"
            sleep 10
          done
          # Tags read off the shipped binaries with `go version -m`, not copied from the
          # Makefile — the two disagree. with_naive_outbound is omitted deliberately: it
          # links a prebuilt libcronet.a using CREL relocations that the binutils on this
          # runner cannot read.
          TAGS='with_gvisor,with_quic,with_wireguard,with_utls,with_clash_api,with_grpc,with_awg,tfogo_checklinkname0,with_conntrack,with_dhcp'
          go build -trimpath -ldflags="-w -s -checklinkname=0 -buildid=" -tags "$TAGS" \
            -o ../aibooster-core ./cmd/main
          cd ..
          file aibooster-core
          # An engine that cannot start must never reach a release. Built with the wrong
          # toolchain it panics before main(), which `version` surfaces immediately.
          ./aibooster-core version

      # `version` is not enough. A module-path rename once produced an engine that compiled,
      # printed its version happily, and then panicked the moment a tunnel started — the
      # corrupted protobuf descriptors live in packages that only initialise by then. So run
      # a real tunnel against a direct outbound and put a request through it.
      - name: Smoke test the engine
        run: |
          mkdir -p enginetest && cd enginetest
          cat > config.json <<'CFG'
          { "log": { "level": "info" }, "outbounds": [ { "type": "direct", "tag": "direct-out" } ] }
          CFG
          cat > settings.json <<'SET'
          {"enable-tun":false,"set-system-proxy":false,"mixed-port":2334,"strict-route":true,
           "tun-implementation":"mixed","mtu":9000,"enable-clash-api":true,"clash-api-port":18756,
           "web-secret":"ci","log-level":"info","remote-dns-address":"1.1.1.1",
           "direct-dns-address":"1.1.1.1","url-test-interval":600,
           "connection-test-url":"http://cp.cloudflare.com/","ipv6-mode":"ipv4_only"}
          SET

          ../aibooster-core run -c config.json -d settings.json > engine.log 2>&1 &
          enginepid=$!
          ready=0
          for _ in $(seq 1 60); do
            if (exec 3<>/dev/tcp/127.0.0.1/2334) 2>/dev/null; then exec 3<&- 3>&-; ready=1; break; fi
            sleep 0.5
          done

          if [ "$ready" -ne 1 ]; then
            echo "::error::the engine never opened its proxy inbound"; cat engine.log; exit 1
          fi

          code="$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 \
                    -x http://127.0.0.1:2334 http://cp.cloudflare.com/ || true)"
          kill "$enginepid" 2>/dev/null || true

          if grep -qiE 'panic|fatal error' engine.log; then
            echo "::error::the engine panicked while running"; cat engine.log; exit 1
          fi
          if [ "$code" != "204" ] && [ "$code" != "200" ]; then
            echo "::error::no traffic through the engine's proxy (HTTP $code)"; cat engine.log; exit 1
          fi
          echo "Engine carried a request through its proxy (HTTP $code)."
          cd ..

      - name: Stage
        run: |
          DESTDIR="$PWD/pkgroot" cmake --install build --prefix /usr
          install -Dm755 aibooster-core "$PWD/pkgroot/usr/libexec/aibooster/aibooster-core"
          find pkgroot -type f | sort

      - name: Package .deb
        run: bash packaging/build-deb.sh "$PWD/pkgroot"

      - name: Portable tarball
        run: |
          # For distributions whose package names differ from Debian's. Same binary, no
          # dependency metadata — the reader installs Qt themselves.
          VERSION="$(sed -n 's/^project(AiBoosterLinux VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)"
          DIR="aibooster-${VERSION}-linux-${{ matrix.arch }}"
          mkdir -p "dist/$DIR"
          cp -a pkgroot/usr/bin/aibooster "dist/$DIR/"
          cp -a aibooster-core "dist/$DIR/"
          cp -a packaging/io.allianceinterstellar.AiBooster.desktop packaging/aibooster.svg \
                README.md NOTICE.md LICENSE "dist/$DIR/"
          tar -C dist -czf "dist/$DIR.tar.gz" "$DIR"
          rm -rf "dist/$DIR"
          ls -l dist/

      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect
        run: |
          mkdir -p dist
          find artifacts -type f \( -name '*.deb' -o -name '*.tar.gz' \) -exec cp {} dist/ \;
          cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          cat > notes.md <<'NOTES'
          Linux desktop client, x86-64 and arm64. Ready to run — the tunnelling engine is
          included.

          The engine is a separate GPL-3.0 program, installed as
          `/usr/libexec/aibooster/aibooster-core`. Its corresponding source is
          [aibooster-engine](https://github.com/AllianceInterStellar/aibooster-engine), and
          this release's copy was built from it by the workflow that produced these files.

          The `.deb` packages are built on Ubuntu 22.04 and install on 22.04 and newer. The
          tarballs are the same binary without dependency metadata, for other distributions.
          NOTES

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" dist/* \
              --repo "$GITHUB_REPOSITORY" \
              --title "AI Booster for Linux $TAG" \
              --notes-file notes.md
          fi
