name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish (created if absent)"
        required: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Built on the oldest release we support, so the packages install on 22.04 and
          # everything newer. Native runners for both architectures — cross-compiling Qt
          # is far more trouble than asking for the right machine.
          - { runner: ubuntu-22.04,     arch: amd64, goarch: amd64 }
          - { runner: ubuntu-22.04-arm, arch: arm64, goarch: arm64 }

    runs-on: ${{ matrix.runner }}
    name: ${{ matrix.arch }}

    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build dpkg-dev \
            qt6-base-dev qt6-declarative-dev libqt6opengl6-dev \
            libgl1-mesa-dev libqt6svg6 libssl-dev

      - name: Build the client
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DAIBOOSTER_BUILD_TESTS=OFF
          cmake --build build --parallel
          file build/aibooster

      # The engine is a separate GPL-3.0 program. We do not keep its source here, so it is
      # built from the upstream release, unmodified, and shipped under our own binary name —
      # which is what NOTICE.md says we do. Pinned to a tag so a release is reproducible.
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.1"
          cache: false

      - name: Build the engine
        env:
          ENGINE_TAG: v4.1.0
        run: |
          # One submodule is declared with an SSH URL, which cannot be cloned anonymously.
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git clone --depth 1 --branch "$ENGINE_TAG" --recurse-submodules --shallow-submodules \
            https://github.com/hiddify/hiddify-core.git engine-src

          cd engine-src
          export GOFLAGS=-trimpath
          # Tags read off the shipped binaries with `go version -m`, not copied from the
          # Makefile — the two disagree. with_naive_outbound is omitted deliberately: it
          # links a prebuilt libcronet.a using CREL relocations, which the binutils on this
          # runner cannot read.
          TAGS='with_gvisor,with_quic,with_wireguard,with_utls,with_clash_api,with_grpc,with_awg,tfogo_checklinkname0,with_conntrack,with_dhcp'
          go build -ldflags="-w -s -checklinkname=0 -buildid=" -tags "$TAGS" \
            -o ../aibooster-core ./cmd/main
          cd ..
          file aibooster-core
          # Refuse to ship an engine that cannot start: older Go toolchains produce a binary
          # that panics in a vendored TLS package before main().
          ./aibooster-core version

      - name: Stage
        run: |
          DESTDIR="$PWD/pkgroot" cmake --install build --prefix /usr
          install -Dm755 aibooster-core "$PWD/pkgroot/usr/libexec/aibooster/aibooster-core"
          find pkgroot -type f | sort

      - name: Package .deb
        run: bash packaging/build-deb.sh "$PWD/pkgroot"

      - name: Portable tarball
        run: |
          # For distributions whose package names differ from Debian's. Same binary, no
          # dependency metadata — the reader installs Qt themselves.
          VERSION="$(sed -n 's/^project(AiBoosterLinux VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)"
          DIR="aibooster-${VERSION}-linux-${{ matrix.arch }}"
          mkdir -p "dist/$DIR"
          cp -a pkgroot/usr/bin/aibooster "dist/$DIR/"
          cp -a aibooster-core "dist/$DIR/"
          cp -a packaging/io.allianceinterstellar.AiBooster.desktop packaging/aibooster.svg \
                README.md NOTICE.md LICENSE "dist/$DIR/"
          tar -C dist -czf "dist/$DIR.tar.gz" "$DIR"
          rm -rf "dist/$DIR"
          ls -l dist/

      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect
        run: |
          mkdir -p dist
          find artifacts -type f \( -name '*.deb' -o -name '*.tar.gz' \) -exec cp {} dist/ \;
          cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          cat > notes.md <<'NOTES'
          Linux desktop client, x86-64 and arm64. Ready to run: the tunnelling engine is
          included.

          The engine is a separate GPL-3.0 program, built unmodified from
          [hiddify-core v4.1.0](https://github.com/hiddify/hiddify-core/tree/v4.1.0) and its
          submodules, and installed as `/usr/libexec/aibooster/aibooster-core`. See NOTICE.md
          for the licensing and for where its source is.

          The `.deb` packages are built on Ubuntu 22.04 and install on 22.04 and newer. The
          tarballs are the same binary without dependency metadata, for other distributions.
          NOTES

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" dist/* \
              --repo "$GITHUB_REPOSITORY" \
              --title "AI Booster for Linux $TAG" \
              --notes-file notes.md
          fi
